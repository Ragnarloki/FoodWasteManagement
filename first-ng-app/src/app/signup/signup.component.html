<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <div class="card shadow-lg">
        <div class="card-body">
          <h2 class="text-center mb-4">Create an Account</h2>
          <form (ngSubmit)="onSubmit()" #signupForm="ngForm">
            <div class="mb-3">
              <label for="fullName" class="form-label">Full Name</label>
              <input type="text" id="fullName" class="form-control" name="fullName" ngModel required>
            </div>
            <div class="mb-3">
              <label for="email" class="form-label">Email Address</label>
              <input type="email" id="email" class="form-control" name="email" ngModel required email>
            </div>
            <div class="mb-3">
              <label for="password" class="form-label">Password</label>
              <input type="password" id="password" class="form-control" name="password" ngModel required minlength="6">
            </div>
            <div class="mb-3">
              <label for="confirmPassword" class="form-label">Confirm Password</label>
              <input type="password" id="confirmPassword" class="form-control" name="confirmPassword" ngModel required>
            </div>
            <div class="mb-3">
              <label for="role" class="form-label">Register As</label>
              <select id="role" class="form-select" name="role" [(ngModel)]="role" required>
                <option value="" disabled selected>Select Role</option>
                <option value="ngo">NGO</option>
                <option value="volunteer">Volunteer</option>
              </select>
            </div>


            <div class="d-grid">
              <button type="submit" class="btn btn-success" [disabled]="!signupForm.form.valid">Sign Up</button>
            </div>
          </form>
          <div class="text-center mt-3">
            <p>Already have an account? <a routerLink="/signin">Sign In</a></p>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
