<div class="signin-page">
  <div class="container">
    <div class="signin-card">
      <h2>Welcome Back</h2>
      <p class="subtitle">Sign in to access your account and continue your journey with us</p>
      
      <form #signinForm="ngForm" (ngSubmit)="onSubmit()">
        <div class="form-group">
          <label for="email">Email Address</label>
          <div class="input-wrapper">
            <i class="bi bi-envelope-fill input-icon"></i>
            <input
              type="email"
              id="email"
              name="email"
              placeholder="Enter your email"
              ngModel
              required
              email
              #email="ngModel"
            />
          </div>
          <span class="error-message" *ngIf="email.invalid && email.touched">
            Please enter a valid email address
          </span>
        </div>
        
        <div class="form-group">
          <label for="password">Password</label>
          <div class="input-wrapper">
            <i class="bi bi-lock-fill input-icon"></i>
            <input
              type="password"
              id="password"
              name="password"
              placeholder="Enter your password"
              ngModel
              required
              minlength="6"
              #password="ngModel"
            />
          </div>
          <span class="error-message" *ngIf="password.invalid && password.touched">
            Password must be at least 6 characters
          </span>
        </div>
        
        <button type="submit"  class="btn btn-primary" [disabled]="!signinForm.form.valid">
          <i class="bi bi-box-arrow-in-right"></i> Sign In
        </button>
        
        <p class="signup-link">
          Don't have an account?
          <a routerLink="/signup" routerLinkActive="active">Sign up</a>
        </p>
      </form>
    </div>
  </div>
</div>
